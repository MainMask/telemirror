services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    env_file:
      - .env
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      # loopback only — the telemirror service reaches Postgres over the compose
      # network; the host mapping is just for local psql/debugging.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemirror:
    build: .
    restart: unless-stopped
    environment:
      # Not a raw DATABASE_URL: config.build_dsn assembles the DSN from the
      # .env DB_* values and percent-encodes them (a password with @ : / # ?
      # would otherwise corrupt the URL).
      DB_HOST: postgres
    env_file:
      - .env
    volumes:
      - ./.configs:/app/.configs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  database:
