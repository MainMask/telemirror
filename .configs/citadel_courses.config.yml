disable_edit: false
disable_delete: true
fallback_link_url: https://t.me/CitadelClan
filters:
- SkipWithUrlFilter:
    blacklist: !!set
      t.me/managerfrm: null
      t.me/frmtribune: null
      t.me/godolympbot: null
      t.me/svyazfromonacobot: null
      t.me/openfrm: null
      t.me/mngrfrm: null
- SkipWithKeywordsFilter:
    keywords: !!set
      O Λ И M П: null
      r'@svyazfromonacobot': null
      Олимп: null
      Золотой билет: null
      r'@managerfrm': null
      r'@mngrfrm': null
      r'@openfrm': null
      r'@godolympbot': null
      r'@frmtribune': null
- WatermarkRemovalFilter:
    remove_watermark: false
    stamp_watermark: true
- RestrictSavingContentBypassFilter
- DocumentFilenameFilter:
    suffix: '@CitadelClan'
    remove:
    - '@openfrm'
    - openfrm
