# Global settings
disable_edit: false      # edits in source sync to mirror (stop-words block the update, not delete)
disable_delete: true     # deletions in source do NOT delete mirrored posts
fallback_link_url: "https://t.me/Archonum"  # substitute for unresolvable cross-channel links

