# Global settings
disable_edit: false      # edits in source sync to mirror (stop-words block the update, not delete)
disable_delete: true     # deletions in source do NOT delete mirrored posts
fallback_link_url: "https://t.me/CitadelOS"  # substitute for unresolvable cross-channel links

# Global filters — applied in order to every direction
filters:
  # 1. Block messages that link to promo bots / old-brand channels
  #    (URL entities — both hyperlinks and bare @mentions)
  - SkipWithUrlFilter:
      blacklist: !!set
        ? t.me/godolympbot
        ? t.me/managerfrm
        ? t.me/mngrfrm
        ? t.me/openfrm
        ? t.me/frmtribune
        ? t.me/svyazfromonacobot

  # 2. Drop entire message if it contains a stop-word (case-insensitive, whole-word match)
  #    Prefix with r'...' to use a regex instead of a plain word.
  - SkipWithKeywordsFilter:
      keywords: !!set
        ? "O Λ И M П"
        ? "Олимп"
        ? "Золотой билет"
        ? "r'@godolympbot'"
        ? "r'@managerfrm'"
        ? "r'@mngrfrm'"
        ? "r'@openfrm'"
        ? "r'@frmtribune'"
        ? "r'@svyazfromonacobot'"

  # 3. Watermarks on photos/videos — global for every mirrored source:
  #      stamp_watermark: true   — overlay telemirror/watermark/my_watermark.png
  #      remove_watermark: false — do NOT detect/inpaint the source's own mark
  #    Set remove_watermark: true (+ template_path: PNG of the mark) to also strip
  #    the source's watermark. Optional `channels: [-100..., -100...]` limits which
  #    sources are processed; omit to cover all. stamp_scale / stamp_opacity —
  #    0.35 / 0.55 defaults.
  - WatermarkRemovalFilter:
      remove_watermark: false
      stamp_watermark: true

  # 4. Bypass Telegram's "restrict saving content" (noforwards) protection by
  #    re-uploading media as a fresh file. Placed after the cheap text-discard
  #    filters above so a dropped message never pays for a media download+reupload.
  #    Must stay after WatermarkRemovalFilter (that filter swaps message.media).
  - RestrictSavingContentBypassFilter

  # 5. Rename mirrored document files: append " - @CitadelOS" and strip promo
  #    fragments from the filename. Must stay after RestrictSavingContentBypassFilter
  #    (patches the already re-uploaded file in place; re-uploads plain reference
  #    documents itself).
  - DocumentFilenameFilter:
      suffix: "@CitadelOS"
      remove:
        - "@openfrm"
        - "openfrm"

# Admin broadcast channel: its posts fan out to every target. Targets not set yet —
# add `broadcast_targets:` (or entries under `directions:`) before running.
broadcast_channel: -1003926294676

# Mirror directions — none configured yet.
directions: []
