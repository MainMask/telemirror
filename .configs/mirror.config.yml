  # 1. Block messages containing competitor channel links (URL entities — both hyperlinks and bare URLs)
  - SkipWithUrlFilter:
      blacklist: !!set
        ? t.me/deskladchina
        ? t.me/xpiratovich
        ? t.me/piratlinks
        ? t.me/daime
        ? t.me/pirat
        ? t.me/kitpaymentbot
        ? t.me/alliance
        ? t.me/privateinc
        ? t.me/skladprivate
        ? t.me/piratnotes
        ? t.me/piratovichfeed
        ? t.me/alliance1000
        ? t.me/piratVPN
        ? t.me/Sovetnik1000
        ? t.me/maximusdesklad

  # 2. Drop entire message if it contains a stop-word (case-insensitive, whole-word match)
  #    Prefix with r'...' to use a regex instead of a plain word.
  - SkipWithKeywordsFilter:
      keywords: !!set
        ? "DE SKLAD"
        ? "DÈ SKLAD"
        ? "DÉ SKLAD"
        ? "Pirat"
        ? "PRIVATE"
        ? "Парат"
        ? "Шеф"
        ? "Пиратович"
        ? "Юнга"
        ? "Альянс"
        ? "Максимус"
        ? "Maximus"

  # 3. Bypass Telegram's "restrict saving content" (noforwards) protection —
  #    placed after the cheap text-discard filters above (so messages skipped by
  #    them never pay for a media download+reupload) but must stay after
  #    WatermarkRemovalFilter (it replaces message.media with a freshly
  #    re-uploaded file, so filters relying on isinstance(media, MessageMediaPhoto/Document)
  #    against the original media must come before it)
  - RestrictSavingContentBypassFilter

  # 4. Replace words/phrases inline (case preserved, whole-word match by default)
  #    Prefix key with r'...' to use a regex; value supports back-references.
  - KeywordReplaceFilter:
      keywords:
        "Alliance": "Archonum"
        "r'@alliance1000'": "@Archonor"
        "r'@daime'": "@Archonor"
        "r'@kitpaymentbot'": "@ArchonumBot"

  # 5. Rename mirrored document files: prepend "@CitadelOS - " and strip promo
  #    fragments from the filename. Must stay after RestrictSavingContentBypassFilter
  #    (patches the already re-uploaded file in place; re-uploads plain reference
  #    documents itself).
  - DocumentFilenameFilter:
      prefix: "@CitadelOS"
      remove:
        - "@openfrm"
        - "openfrm"

