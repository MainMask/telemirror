[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Bug-adjacent rules only; stylistic families (UP/SIM/typing) are left out on
# purpose to keep the diff surgical.
select = ["F", "E9", "B", "PIE", "C4", "FLY", "LOG"]

[tool.ruff.lint.per-file-ignores]
# vendored Telethon fork — kept close to upstream
"telemirror/_patch/*" = ["B", "PIE", "C4"]
