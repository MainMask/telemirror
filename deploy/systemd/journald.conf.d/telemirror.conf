# Installed by bootstrap.sh into /etc/systemd/journald.conf.d/. Caps the
# journal so the 24/7 services' logs don't fill the disk. bootstrap creates
# /var/log/journal (persistent) — only then does SystemMaxUse apply; before
# that the journal lives in tmpfs, bounded by RuntimeMaxUse instead.
[Journal]
SystemMaxUse=500M
RuntimeMaxUse=200M
