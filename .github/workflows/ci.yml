name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # tests/test_storage_postgres.py runs PostgresDatabase against it (skipped without)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # the real-encode watermark tests (tests/test_watermark_video_encode.py) skip without it
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes $(git ls-files '*.py')
      - run: python -m ruff check
      - run: python -m mypy .
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
